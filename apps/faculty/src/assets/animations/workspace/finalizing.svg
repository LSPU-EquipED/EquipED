<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" fill="none" class="workspace-motion" role="img" aria-labelledby="title description">
<title id="title">Saving the findings</title><desc id="description">Separate findings cards gather into a record sheet and descend into a folder. Saving does not constitute institutional approval.</desc>
<style>
.record-sheet{animation:file-record 4.8s cubic-bezier(.2,.7,.2,1) infinite both}
.finding-one{animation:collect-one 4.8s cubic-bezier(.2,.7,.2,1) infinite both}
.finding-two{animation:collect-two 4.8s cubic-bezier(.2,.7,.2,1) infinite both}
@keyframes file-record{0%,10%,100%{transform:translateY(-52px)}50%,78%{transform:translateY(0)}}
@keyframes collect-one{0%,10%,100%{transform:translate(95px,-17px);opacity:0}23%{opacity:1}48%,78%{transform:translate(0,0);opacity:1}}
@keyframes collect-two{0%,20%,100%{transform:translate(122px,18px);opacity:0}32%{opacity:1}58%,78%{transform:translate(0,0);opacity:1}}
@media(prefers-reduced-motion:reduce){.workspace-motion *{animation:none!important}}</style>

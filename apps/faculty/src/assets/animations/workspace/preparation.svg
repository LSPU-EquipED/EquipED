<g class="page-right"><g transform="translate(385 116) rotate(13 78 100)"><path d="M0 0h130l26 26v179H0Z" fill="#fbfcfc" stroke="#1b3b87" stroke-width="3" stroke-linejoin="round"/><path d="M130 0v26h26" fill="#d9ad1d" stroke="#1b3b87" stroke-width="3" stroke-linejoin="round"/><path d="M20 46h98" stroke="#1b3b87" stroke-width="8"/><path d="M20 68h112m-112 16h94m-94 16h106" stroke="#91a5ad" stroke-width="4"/></g></g>
<g class="page-center"><g transform="translate(273 94)"><path d="M0 0h148l26 26v209H0Z" fill="#fbfcfc" stroke="#1b3b87" stroke-width="3" stroke-linejoin="round"/><path d="M148 0v26h26" fill="#d9ad1d" stroke="#1b3b87" stroke-width="3" stroke-linejoin="round"/><path d="M20 46h116" stroke="#1b3b87" stroke-width="8"/><path d="M20 68h130m-130 16h112m-112 16h124" stroke="#91a5ad" stroke-width="4"/><rect x="15" y="119" width="144" height="31" rx="2" fill="#fbf3cf"/><path d="M22 130h119m-119 12h104" stroke="#d9ad1d" stroke-width="4"/><path d="M20 177h130m-130 16h103m-103 16h118" stroke="#91a5ad" stroke-width="4"/></g></g>

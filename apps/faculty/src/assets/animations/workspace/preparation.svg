<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" fill="none" class="workspace-motion" role="img" aria-labelledby="title description">
<title id="title">Assembling the module</title><desc id="description">Separated pages move into an assembly frame as a scan line crosses the paper. Decorative preparation motion, not measured progress.</desc>
<style>
.page-left{animation:assemble-left 4.8s cubic-bezier(.2,.7,.2,1) infinite both}
.page-right{animation:assemble-right 4.8s cubic-bezier(.2,.7,.2,1) infinite both}
.page-center{animation:assemble-center 4.8s cubic-bezier(.2,.7,.2,1) infinite both}
.scan-line{animation:scan-page 4.8s ease-in-out infinite both}
@keyframes assemble-left{0%,10%,100%{transform:translate(-68px,28px);opacity:.45}42%,78%{transform:translate(0,0);opacity:1}}
@keyframes assemble-right{0%,10%,100%{transform:translate(68px,-25px);opacity:.45}46%,78%{transform:translate(0,0);opacity:1}}
@keyframes assemble-center{0%,10%,100%{transform:translateY(-34px)}42%,78%{transform:translateY(0)}}
@keyframes scan-page{0%,42%,100%{transform:translateY(-112px);opacity:0}47%{opacity:1}72%{transform:translateY(96px);opacity:1}78%,90%{transform:translateY(96px);opacity:0}}
@media(prefers-reduced-motion:reduce){.workspace-motion *{animation:none!important}}</style>

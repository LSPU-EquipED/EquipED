<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" fill="none" class="workspace-motion" role="img" aria-labelledby="title description">
<title id="title">Waiting in the queue</title><desc id="description">A manuscript rests in a waiting tray beside a clock. Looping decorative motion does not estimate waiting time.</desc>
<style>
.waiting-paper{animation:waiting-paper 2.1s ease-in-out infinite both}
.clock-hand{transform-origin:496px 182px;animation:waiting-hand 2.1s ease-in-out infinite both}
@keyframes waiting-paper{0%,100%{transform:translateY(0)}50%{transform:translateY(-17px)}}
@keyframes waiting-hand{0%,100%{transform:rotate(0deg)}50%{transform:rotate(32deg)}}
@media(prefers-reduced-motion:reduce){.workspace-motion *{animation:none!important}}</style>

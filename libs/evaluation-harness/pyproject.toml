[project]
name = "equiped-evaluation-harness"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2"]

[dependency-groups]
dev = ["pytest>=8.4.2", "jsonschema>=4"]

[build-system]
requires = ["uv_build>=0.11.25,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "equiped_harness"
module-root = ""

[tool.pytest.ini_options]
pythonpath = ["tests"]

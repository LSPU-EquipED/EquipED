schema: spec-driven

context: |
  FastAPI modular monolith with infrastructure-only `server/core/` and a feature-isolated React client.
  Evaluations use in-process database-backed admission and draining; Layer 3 specialist agents run in parallel under the supervisor, and Layer 4 synthesis is terminal.
  PostgreSQL, ChromaDB, uploads, and model inference remain institution-controlled; SLMs are direct input and are never embedded.

rules:
  proposal:
    - State the user outcome, scope, non-goals, affected capabilities, and material high-risk impacts.
  specs:
    - Use delta specs and observable WHEN/THEN requirements; restate ownership, residency, and human-review invariants because omission never waives them.
  design:
    - Record only material decisions, trade-offs, failure modes, and module-boundary impacts.
  tasks:
    - Order bounded tasks by dependency and include explicit verification before completion.

operations:
  apply:
    guidance:
      - Implement only approved tasks; stop on contract conflicts and run narrow verification before completion.
  archive:
    guidance:
      - Archives are historical evidence only; never edit or re-apply an archived delta without a new proposal.
      - Compare deltas against canonical specs and preserve newer canonical wording.
      - Never use no-validate, unattended, or bulk archive in this repository.

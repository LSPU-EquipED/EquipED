[project]
name = "equiped-server"
version = "0.1.0"
description = "EquipEd backend scaffold (FastAPI modular monolith)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.18.4",
  "asyncpg>=0.31.0",
  "psycopg2-binary>=2.9.12",
  "python-multipart>=0.0.20",
  "python-dotenv>=1.0.1",
  "PyMuPDF>=1.24",
  "Pillow>=10.0",
  "pytesseract>=0.3.10",
  "chromadb>=0.5",
  "onnxruntime==1.18.1; sys_platform == \"darwin\" and platform_machine == \"x86_64\"",
  "numpy<2",
  "scikit-learn>=1.5",
  "transformers>=4.41,<5",
  "sentence-transformers>=3.0,<5",
  "torch==2.2.2; platform_system == \"Darwin\" and platform_machine == \"x86_64\"",
]

# Note: run with `uvicorn server.main:app --reload --host 0.0.0.0 --port 8000`

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.4.2",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []
